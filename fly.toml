# Change `app` to the name you chose. PUBLIC_URL must then be https://<that name>.fly.dev
app = "multistream-relay"
primary_region = "mad"

[env]
  DATA_DIR = "/data"
  TIKTOK_ENABLED = "1"
  TIKTOK_MAX_ROOMS = "20"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: Kick's webhooks and the open WebSockets must find it running.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
    grace_period = "10s"

[mounts]
  source = "relay_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
